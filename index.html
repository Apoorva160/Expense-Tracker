<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <header>
    <h1>Expense Tracker</h1>
    <h2 id="balance">Balance: ₹0</h2>
  </header>



  <section class="form-section">
    <form id="transaction-form">
      <input type="text" id="title" placeholder="Title" required />
      <input type="number" id="amount" placeholder="Amount (₹)" required />
      <select id="type" required>
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>
      <select id="category" required>
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Shopping">Shopping</option>
        <option value="Bills">Bills</option>
        <option value="Other">Other</option>
      </select>
      <input type="month" id="date" required />
      <label>
        <input type="checkbox" id="recurring" /> Mark as Recurring
      </label>
      <button type="submit">Add Transaction</button>
    </form>
  </section>

  <section>
    <input type="text" id="search" placeholder="Search transactions" />
  </section>

  <section class="transaction-list" id="transaction-list">
    <!-- Transactions will appear here -->
  </section>

  <section class="charts">
    <canvas id="pieChart"></canvas>
    <canvas id="barChart"></canvas>
  </section>

  <button onclick="downloadCSV()">Download CSV</button>

  <script src="script.js"></script>
</body>
</html>
